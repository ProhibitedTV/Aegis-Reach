name: Publish Windows Standalone

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag for the standalone build
        required: true
        default: v0.2.0-alpha
      export_dir:
        description: Existing GameGuru MAX standalone export directory on the Windows runner
        required: true
        default: C:\AegisReachBuilds\First-Light
      prerelease:
        description: Mark release as prerelease
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: [self-hosted, windows, x64]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source commit
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify runner prerequisites
        shell: powershell
        run: |
          python --version
          gh --version
          if (-not (Test-Path -LiteralPath '${{ inputs.export_dir }}')) {
            throw 'Standalone export directory does not exist: ${{ inputs.export_dir }}'
          }

      - name: Reject an existing release tag
        shell: powershell
        run: |
          gh release view '${{ inputs.tag }}' --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw 'Release ${{ inputs.tag }} already exists; refusing to replace it.'
          }
          exit 0

      - name: Verify and package standalone export
        shell: powershell
        run: |
          python -B tools\firstlight_standalone.py package `
            --root '${{ inputs.export_dir }}' `
            --tag '${{ inputs.tag }}' `
            --output-dir "$env:GITHUB_WORKSPACE\dist"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish standalone release
        shell: powershell
        run: |
          $tag = '${{ inputs.tag }}'
          $safe = if ($tag.StartsWith('v')) { $tag.Substring(1) } else { $tag }
          $package = "dist\Aegis-Reach-First-Light-$safe-win64.zip"
          $checksum = "$package.sha256"
          $notes = "dist\Aegis-Reach-First-Light-$safe-win64-release-notes.md"
          $flags = @()
          if ('${{ inputs.prerelease }}' -eq 'true') { $flags += '--prerelease' }
          gh release create $tag $package $checksum `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Aegis Reach: First Light - Windows Standalone $tag" `
            --notes-file $notes @flags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
